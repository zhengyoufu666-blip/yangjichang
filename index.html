<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>养鸡场 - 基金记录</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🐔 养鸡场</h1>
            <p class="subtitle">基金每日记录 · 手动买卖 / 日定投 / 其它</p>
            <button class="refresh-btn" onclick="refreshData()">🔄 刷新数据</button>
        </header>

        <main>
            <!-- 甩锅区 -->
            <div class="disclaimer" id="disclaimer" style="display: none;">
                <div class="disclaimer-title">💬 杂七杂八的甩锅区</div>
                <div class="disclaimer-content" id="disclaimer-content"></div>
            </div>

            <div class="stats">
                <div class="stat-card">
                    <span class="stat-label">总操作</span>
                    <span class="stat-value" id="total-operations">-</span>
                </div>
                <div class="stat-card">
                    <span class="stat-label">买入金额</span>
                    <span class="stat-value" id="total-buy">-</span>
                </div>
                <div class="stat-card">
                    <span class="stat-label">卖出金额</span>
                    <span class="stat-value" id="total-sell">-</span>
                </div>
            </div>

            <div class="table-container">
                <table id="records-table">
                    <thead>
                        <tr>
                            <th>日期</th>
                            <th>基金代码</th>
                            <th>基金名称</th>
                            <th>基金限购</th>
                            <th>操作</th>
                            <th>金额</th>
                            <th>备注</th>
                        </tr>
                    </thead>
                    <tbody id="records-body">
                        <tr class="loading-row">
                            <td colspan="7">加载中...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </main>

        <footer>
            <p>数据来源：Google Sheets · 最后更新：<span id="last-update">-</span></p>
        </footer>
    </div>

    <script src="app.js"></script>
</body>
</html>
