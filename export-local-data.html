<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>导出本地数据工具</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 800px;
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            color: white;
            padding: 30px;
            text-align: center;
        }
        
        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }
        
        .header p {
            opacity: 0.9;
            font-size: 1.1rem;
        }
        
        .content {
            padding: 40px;
        }
        
        .api-info {
            background: #f8fafc;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 30px;
            border: 2px solid #e2e8f0;
        }
        
        .api-info h3 {
            color: #4f46e5;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .api-url {
            background: #1e293b;
            color: #94a3b8;
            padding: 15px;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            font-size: 0.9rem;
            word-break: break-all;
            margin: 15px 0;
        }
        
        .controls {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }
        
        .btn {
            padding: 15px 30px;
            border: none;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            flex: 1;
            min-width: 200px;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #10b981, #34d399);
            color: white;
        }
        
        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(16, 185, 129, 0.4);
        }
        
        .btn-secondary {
            background: linear-gradient(135deg, #3b82f6, #60a5fa);
            color: white;
        }
        
        .btn-secondary:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(59, 130, 246, 0.4);
        }
        
        .btn-danger {
            background: linear-gradient(135deg, #ef4444, #f87171);
            color: white;
        }
        
        .btn-danger:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(239, 68, 68, 0.4);
        }
        
        .status {
            background: #f1f5f9;
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 30px;
            min-height: 120px;
        }
        
        .status h3 {
            color: #475569;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .status-content {
            font-size: 1rem;
            line-height: 1.6;
            color: #64748b;
        }
        
        .status-success {
            color: #10b981;
            font-weight: 600;
        }
        
        .status-error {
            color: #ef4444;
            font-weight: 600;
        }
        
        .status-loading {
            color: #3b82f6;
            font-weight: 600;
        }
        
        .data-preview {
            background: #0f172a;
            color: #cbd5e1;
            border-radius: 12px;
            padding: 20px;
            font-family: 'Courier New', monospace;
            font-size: 0.85rem;
            max-height: 300px;
            overflow-y: auto;
            white-space: pre-wrap;
            margin-top: 20px;
        }
        
        .data-preview h4 {
            color: #94a3b8;
            margin-bottom: 10px;
            font-family: inherit;
        }
        
        .footer {
            text-align: center;
            padding: 20px;
            color: #64748b;
            font-size: 0.9rem;
            border-top: 1px solid #e2e8f0;
        }
        
        .spinner {
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .icon {
            font-size: 1.5rem;
        }
        
        @media (max-width: 768px) {
            .header h1 {
                font-size: 2rem;
            }
            
            .content {
                padding: 20px;
            }
            
            .btn {
                min-width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>
                <span class="icon">📊</span>
                养鸡场数据导出工具
            </h1>
            <p>从Google Sheets导出真实数据到本地备份文件</p>
        </div>
        
        <div class="content">
            <div class="api-info">
                <h3><span class="icon">🔗</span> API连接信息</h3>
                <p>当前连接的Google Sheets API地址：</p>
                <div class="api-url" id="api-url">正在加载...</div>
                <p>将从"养鸡场"Google表格中导出以下工作表数据：定投基金、主动操作、说明</p>
            </div>
            
            <div class="controls">
                <button class="btn btn-primary" onclick="fetchData()" id="fetch-btn">
                    <span class="icon">🔄</span>
                    获取Google Sheets数据
                </button>
                <button class="btn btn-secondary" onclick="exportToLocalFile()" id="export-btn" disabled>
                    <span class="icon">💾</span>
                    导出到本地文件
                </button>
                <button class="btn btn-danger" onclick="testLocalData()" id="test-btn">
                    <span class="icon">🧪</span>
                    测试本地数据
                </button>
            </div>
            
            <div class="status">
                <h3><span class="icon">📈</span> 操作状态</h3>
                <div class="status-content" id="status">
                    等待操作...
                </div>
                
                <div id="data-preview" class="data-preview" style="display: none;">
                    <h4>数据预览：</h4>
                    <div id="preview-content"></div>
                </div>
            </div>
        </div>
        
        <div class="footer">
            <p>© 2026 养鸡场基金记录系统 | 数据导出工具 v1.0</p>
            <p>注意：此工具仅用于数据备份，请勿泄露敏感信息</p>
        </div>
    </div>

    <script>
        // 从app.js获取API URL
        const GOOGLE_SHEET_API_URL = 'https://script.google.com/macros/s/AKfycbw7TMJDyFDBIM0JGU15YseYlZ-bggEW9oHNIMI1ZtiYlEIyjBq3DZJhI-zN9gKMdyOQ/exec';
        
        // 存储获取的数据
        let fetchedData = null;
        
        // 更新API URL显示
        document.getElementById('api-url').textContent = GOOGLE_SHEET_API_URL;
        
        // 更新状态
        function updateStatus(message, type = 'info') {
            const statusEl = document.getElementById('status');
            statusEl.innerHTML = `<span class="status-${type}">${message}</span>`;
            console.log(`[${type.toUpperCase()}] ${message}`);
        }
        
        // 显示数据预览
        function showDataPreview(data) {
            const previewEl = document.getElementById('data-preview');
            const contentEl = document.getElementById('preview-content');
            
            // 格式化数据为可读格式
            const previewText = JSON.stringify(data, null, 2);
            contentEl.textContent = previewText.substring(0, 2000) + (previewText.length > 2000 ? '...' : '');
            
            previewEl.style.display = 'block';
        }
        
        // 获取Google Sheets数据
        async function fetchData() {
            const fetchBtn = document.getElementById('fetch-btn');
            const originalText = fetchBtn.innerHTML;
            
            try {
                // 显示加载状态
                fetchBtn.innerHTML = '<div class="spinner"></div> 获取中...';
                fetchBtn.disabled = true;
                updateStatus('正在连接Google Sheets API...', 'loading');
                
                // 发送请求
                const response = await fetch(GOOGLE_SHEET_API_URL);
                
                if (!response.ok) {
                    throw new Error(`API请求失败: ${response.status} ${response.statusText}`);
                }
                
                updateStatus('正在解析数据...', 'loading');
                const jsonData = await response.json();
                
                // 提取需要的数据（按照完整表头结构）
                const dcaData = jsonData['定投基金'] ? jsonData['定投基金'].rows : [];
                const activeData = jsonData['主动操作'] ? jsonData['主动操作'].rows : [];
                
                let disclaimer = '';
                if (jsonData['说明'] && jsonData['说明'].rows.length > 0) {
                    const firstRow = jsonData['说明'].rows[0];
                    disclaimer = firstRow['风险说明'] || '';
                }
                
                // 验证数据字段
                console.log('定投基金字段:', dcaData.length > 0 ? Object.keys(dcaData[0]) : '无数据');
                console.log('主动操作字段:', activeData.length > 0 ? Object.keys(activeData[0]) : '无数据');
                
                // 存储数据
                fetchedData = {
                    LOCAL_DCA_DATA: dcaData,
                    LOCAL_ACTIVE_DATA: activeData,
                    LOCAL_DISCLAIMER: disclaimer
                };
                
                // 检查数据完整性
                let dcaFields = [];
                let activeFields = [];
                
                if (dcaData.length > 0) {
                    dcaFields = Object.keys(dcaData[0]);
                }
                
                if (activeData.length > 0) {
                    activeFields = Object.keys(activeData[0]);
                }
                
                // 更新状态
                updateStatus(`✅ 数据获取成功！获取到 ${dcaData.length} 条持仓记录和 ${activeData.length} 条操作记录`, 'success');
                
                // 显示字段信息
                const statusEl = document.getElementById('status');
                statusEl.innerHTML += `<br><small>定投基金字段: ${dcaFields.join(', ')}</small>`;
                statusEl.innerHTML += `<br><small>主动操作字段: ${activeFields.join(', ')}</small>`;
                
                // 启用导出按钮
                document.getElementById('export-btn').disabled = false;
                
                // 显示数据预览
                showDataPreview({
                    定投基金记录数: dcaData.length,
                    定投基金字段: dcaFields,
                    主动操作记录数: activeData.length,
                    主动操作字段: activeFields,
                    风险说明: disclaimer.substring(0, 100) + '...',
                    示例持仓: dcaData.length > 0 ? {
                        分类: dcaData[0]['分类'],
                        基金代码: dcaData[0]['基金代码'],
                        基金名称: dcaData[0]['基金名称'],
                        近6月回报: dcaData[0]['近6月回报'],
                        操作: dcaData[0]['操作']
                    } : '无数据'
                });
                
            } catch (error) {
                console.error('获取数据失败:', error);
                updateStatus(`❌ 获取数据失败: ${error.message}`, 'error');
                
                // 显示错误详情
                const previewEl = document.getElementById('data-preview');
                const contentEl = document.getElementById('preview-content');
                contentEl.textContent = `错误详情: ${error.stack || error.message}`;
                previewEl.style.display = 'block';
                
            } finally {
                // 恢复按钮状态
                fetchBtn.innerHTML = originalText;
                fetchBtn.disabled = false;
            }
        }
        
        // 导出到本地文件
        function exportToLocalFile() {
            if (!fetchedData) {
                updateStatus('❌ 请先获取数据', 'error');
                return;
            }
            
            try {
                updateStatus('正在生成本地数据文件...', 'loading');
                
                // 生成JavaScript文件内容（按照完整表头结构）
                const fileContent = `/**
 * 本地备份数据文件
 * 从Google Sheets导出的真实数据
 * 导出时间: ${new Date().toLocaleString('zh-CN')}
 * 表头结构：
 * - 定投基金: 分类, 基金代码, 基金名称, 近6月回报, 操作, 备注, 金额, 累计收益, 基金限购, 当日估值
 * - 主动操作: 操作时间, 每日定投, 买入操作, 卖出操作, 当日留言
 * - 说明: 风险说明
 */

// 本地备选基金数据（当前持仓）- 完整表头结构
const LOCAL_DCA_DATA = ${JSON.stringify(fetchedData.LOCAL_DCA_DATA, null, 2)};

// 本地主动操作数据 - 完整表头结构
const LOCAL_ACTIVE_DATA = ${JSON.stringify(fetchedData.LOCAL_ACTIVE_DATA, null, 2)};

// 本地风险说明
const LOCAL_DISCLAIMER = ${JSON.stringify(fetchedData.LOCAL_DISCLAIMER)};

// 导出数据（如果使用模块化）
if (typeof module !== 'undefined' && module.exports) {
    module.exports = {
        LOCAL_DCA_DATA,
        LOCAL_ACTIVE_DATA,
        LOCAL_DISCLAIMER
    };
}`;
                
                // 创建下载链接
                const blob = new Blob([fileContent], { type: 'application/javascript' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'local-data.js';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                
                updateStatus(`✅ 本地数据文件已生成并下载！包含 ${fetchedData.LOCAL_DCA_DATA.length} 条持仓记录（完整表头结构）`, 'success');
                
                // 显示文件内容预览
                const previewEl = document.getElementById('data-preview');
                const contentEl = document.getElementById('preview-content');
                contentEl.textContent = fileContent.substring(0, 1500) + '...\n\n(文件已下载，完整内容请查看下载的文件)';
                previewEl.style.display = 'block';
                
            } catch (error) {
                console.error('导出文件失败:', error);
                updateStatus(`❌ 导出文件失败: ${error.message}`, 'error');
            }
        }
        
        // 测试本地数据
        function testLocalData() {
            updateStatus('正在测试本地数据文件...', 'loading');
            
            // 尝试读取当前的local-data.js文件
            fetch('local-data.js')
                .then(response => {
                    if (!response.ok) {
                        throw new Error(`文件不存在或无法访问: ${response.status}`);
                    }
                    return response.text();
                })
                .then(content => {
                    // 简单检查文件内容
                    const hasLocalData = content.includes('LOCAL_DCA_DATA');
                    const hasActiveData = content.includes('LOCAL_ACTIVE_DATA');
                    
                    if (hasLocalData && hasActiveData) {
                        updateStatus('✅ 本地数据文件存在且格式正确', 'success');
                        
                        // 显示文件基本信息
                        const lineCount = content.split('\n').length;
                        const size = (content.length / 1024).toFixed(2);
                        const previewEl = document.getElementById('data-preview');
                        const contentEl = document.getElementById('preview-content');
                        contentEl.textContent = `文件信息:\n- 大小: ${size} KB\n- 行数: ${lineCount}\n- 包含: LOCAL_DCA_DATA, LOCAL_ACTIVE_DATA 等变量\n\n前500字符预览:\n${content.substring(0, 500)}...`;
                        previewEl.style.display = 'block';
                    } else {
                        updateStatus('⚠️ 本地数据文件存在但可能格式不正确', 'error');
                    }
                })
                .catch(error => {
                    updateStatus(`❌ 测试失败: ${error.message}`, 'error');
                });
        }
        
        // 初始化
        updateStatus('工具已就绪，点击"获取Google Sheets数据"开始导出', 'info');
    </script>
</body>
</html>
